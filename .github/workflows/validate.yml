name: Validate Zagrosi Forge

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install trial compiler
        run: npm ci --prefix tools
      - name: Validate JSON
        run: |
          python -m json.tool .codex-plugin/plugin.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool .claude-plugin/marketplace.json >/dev/null
      - name: Check release identity
        run: python tools/sync_release.py --check
      - name: Check runtime manifest
        run: python tools/update_runtime_manifest.py --check
      - name: Check package membership
        run: python tools/update_package_manifest.py --check
      - name: Run tests
        run: uv run --with pytest python -m pytest --durations=20 --durations-min=1
      - name: Run strict example gates
        run: |
          python scripts/zagrosi_skills.py lint-project-manifest --planning-dir examples/saas --strict
          python scripts/zagrosi_skills.py lint-project-manifest --planning-dir examples/typescript-app --strict
          python scripts/zagrosi_skills.py lint-plan --planning-dir examples/saas/01-authentication --depth standard --strict
          python scripts/zagrosi_skills.py lint-sections --planning-dir examples/saas/01-authentication --depth standard --strict
          python scripts/zagrosi_skills.py traceability --planning-dir examples/saas/01-authentication --strict
          python scripts/zagrosi_skills.py forge-score --planning-dir examples/saas/01-authentication --depth standard --strict
          python scripts/zagrosi_skills.py lint-plan --planning-dir examples/typescript-app/01-auth --depth standard --strict
          python scripts/zagrosi_skills.py lint-sections --planning-dir examples/typescript-app/01-auth --depth standard --strict
          python scripts/zagrosi_skills.py traceability --planning-dir examples/typescript-app/01-auth --strict
          python scripts/zagrosi_skills.py forge-score --planning-dir examples/typescript-app/01-auth --depth standard --strict
      - name: Run eval suite
        run: python scripts/zagrosi_skills.py eval-suite --examples-dir examples --check-snapshots --output examples/evals/latest.json

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            group: all
          - os: macos-latest
            python: "3.12"
            group: all
          - os: windows-latest
            python: "3.12"
            group: shared
          - os: windows-latest
            python: "3.12"
            group: portable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install trial compiler
        run: npm ci --prefix tools
      - run: python -m pip install "pytest>=8"
      - run: python tools/update_runtime_manifest.py --check
      - name: Check shared host packaging and review
        if: matrix.group != 'portable'
        run: python -m pytest -q tests/test_claude_plugin.py tests/test_capabilities.py tests/test_release_identity.py tests/test_portable_gate_batch.py tests/test_cross_host_resume.py tests/test_trial_hosts.py tests/test_complete_plan_admission.py tests/test_providers.py tests/test_provider_output.py tests/test_installation_contract.py tests/test_cli_helper_timeouts.py tests/test_verification_symlinks.py tests/test_verification_repositories.py tests/test_project_session_validation.py tests/test_native_workflow_trials.py tests/test_trial_planning_roots.py tests/test_mutable_state_safety.py tests/test_directory_observations.py tests/test_pretty_workflows.py tests/test_completion_output.py tests/test_workflow_handoff.py tests/test_verification_diagnostics.py tests/test_runtime_lifecycle.py tests/test_provider_recovery.py tests/test_provider_preflight.py tests/test_native_package_identity.py tests/test_workflow_sequences.py tests/test_typescript_contract.py tests/test_ci_coverage.py tests/test_compatibility_checks.py tests/test_compatibility_workflows.py tests/test_compatibility_admission.py tests/test_heldout_contracts.py tests/test_team_state.py tests/test_team_git.py tests/test_team_config.py tests/test_team_collaboration.py tests/test_team_workflows.py tests/test_team_guidance.py tests/test_team_plan_claims.py tests/test_team_plans.py tests/test_team_plan_workflows.py tests/test_team_plan_integration.py --durations=20 --durations-min=1
      - name: Check explicitly owned verification inputs
        if: matrix.group != 'portable'
        run: python -m pytest -q tests/test_owned_verification.py --durations=20 --durations-min=1
      - name: Check portable workflows and runtime loading
        if: matrix.group != 'shared'
        run: python -m pytest -q tests/test_compact_plan.py tests/test_completion_contracts.py tests/test_context_packets.py tests/test_context_usability.py tests/test_coding_trials.py tests/test_trial_realism.py tests/test_runtime_loading.py tests/test_workflow_admission.py tests/test_runtime_reuse.py tests/test_evidence_discovery.py tests/test_mutable_state.py tests/test_resume_context.py tests/test_parsed_plan_reuse.py tests/test_cache_publication.py tests/test_adapter_loading.py tests/test_install_config_safety.py tests/test_verification_contracts.py tests/test_trial_matrix.py tests/test_controlled_trials.py tests/test_planning_contract.py tests/test_implementation_phase_reuse.py tests/test_installation.py::test_update_check_invalid_package_returns_json_without_mutation tests/test_retry_trial.py tests/test_trial_workspaces.py tests/test_trial_suite_attempt_lineage.py tests/test_trial_suite_cancellation.py tests/test_trial_suite_cleanup_guard.py tests/test_trial_suite_cleanup_review.py tests/test_trial_suite_cli.py tests/test_trial_suite_cli_identity.py tests/test_trial_suite_comparison.py tests/test_trial_suite_comparison_lineage.py tests/test_trial_suite_docker.py tests/test_trial_suite_entry_preservation.py tests/test_trial_suite_entry_selection.py tests/test_trial_suite_execution.py tests/test_trial_suite_git_quiescence.py tests/test_trial_suite_inventory.py tests/test_trial_suite_isolation.py tests/test_trial_suite_manifest.py tests/test_trial_suite_matrix_cli.py tests/test_trial_suite_native_events.py tests/test_trial_suite_native_layout.py tests/test_trial_suite_native_lineage.py tests/test_trial_suite_native_loading.py tests/test_trial_suite_native_preflight.py tests/test_trial_suite_native_preparation.py tests/test_trial_suite_native_runtime.py tests/test_trial_suite_probes.py tests/test_trial_suite_qualification.py tests/test_trial_suite_reservation.py tests/test_trial_suite_resource_bounds.py tests/test_trial_suite_review_boundaries.py tests/test_trial_suite_setup_readback.py tests/test_trial_suite_workflow.py tests/test_trial_suite_empty_baseline.py tests/test_trial_suite_windows_identity.py tests/test_trial_suite_binary_reads.py --durations=20 --durations-min=1
      - name: Check native processes on macOS
        if: runner.os == 'macOS'
        run: python -m pytest -q tests/test_native_process.py --durations=20 --durations-min=1

  native-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pinned native hosts
        run: npm install -g @openai/codex@0.154.0 @anthropic-ai/claude-code@2.1.285
      - name: Verify native discovery and upgrades without model calls
        run: python tools/native_plugin_smoke.py --require --upgrade
